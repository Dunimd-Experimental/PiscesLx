[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xsc"
version = "0.1.0"
description = "Xi Message Controller - Server for Xi Studio"
authors = [{name = "Wenze Wei"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "websockets>=11.0",
]

[project.optional-dependencies]
nvidia = ["pynvml>=11.0.0"]
amd = ["pyamdgpuinfo>=2.0.0"]

[project.scripts]
xsc = "xsc.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xsc*"]
