# ========================================
# EnTA Training Pipeline (671B Edition - Flagship)
# ========================================
# All EnTA runtime configuration is driven by this YAML file.
# Teachers, judge, rollouts, and rewards are user-configurable.
# ========================================

backend: local
model_name: Qwen/Qwen3-671B-Instruct
device: cpu
base_url: http://127.0.0.1:8000/v1
api_key: EMPTY
server_model: Qwen/Qwen3-671B-Instruct

panel_file: ""
teachers:
  - name: generalist
    role: general
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
  - name: reasoner
    role: reason
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
  - name: tooler
    role: tool
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
  - name: coder
    role: code
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
  - name: videoer
    role: video
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""

judge: null

max_steps: 64
temperature: 0.7
max_tokens: 5120
max_violations: 12

completion_weight: 0.55
tool_weight: 0.25
safety_weight: 0.1
execution_weight: 0.1

sft:
  use_encre_data_pipeline: true
  encre_use_roundtable: true
  encre_prompts_path: data/prompts/seed_prompts_671B.txt
  encre_data_cache_path: .pisceslx/cache/encre_sft_dataset_671B.jsonl
  encre_max_samples: 24576
  encre_system_prompt: "You are a careful, expert assistant.  Show your reasoning step by step."

grpo:
  use_encre_rollout: true
  encre_use_roundtable: false
  encre_system_prompt: "You are an agent.  Use the available tools to solve the task.  Stop when done."
  group_size: 16
  temperature: 1.0
  clip_ratio: 0.2
  entropy_coef: 0.01
  kl_coef: 0.1
  max_new_tokens: 2560
  ppo_epochs: 2
  agent_rollout_steps: 16
  max_tool_calls: 40
  tool_call_reward: 0.1
  task_completion_reward: 1.0
  efficiency_penalty: -0.01
