# ========================================
# EnTA Training Pipeline (32B Edition)
# ========================================
# All EnTA runtime configuration is driven by this YAML file.
# Teachers, judge, rollouts, and rewards are user-configurable.
# ========================================

# Student model rollout backend
backend: local
model_name: Qwen/Qwen3-32B-Instruct
device: cpu
base_url: http://127.0.0.1:8000/v1
api_key: EMPTY
server_model: Qwen/Qwen3-32B-Instruct

# Teacher panel (user-supplied; default template below)
panel_file: ""
teachers:
  - name: generalist
    role: general
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
  - name: reasoner
    role: reason
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
  - name: tooler
    role: tool
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""

# Judge (user-supplied; default is first teacher if null)
judge: null

# Rollout loop parameters
max_steps: 36
temperature: 0.7
max_tokens: 2560
max_violations: 8

# Reward weights (must sum to 1.0)
completion_weight: 0.6
tool_weight: 0.2
safety_weight: 0.1
execution_weight: 0.1

# SFT integration
sft:
  use_encre_data_pipeline: true
  encre_use_roundtable: true
  encre_prompts_path: data/prompts/seed_prompts_32B.txt
  encre_data_cache_path: .pisceslx/cache/encre_sft_dataset_32B.jsonl
  encre_max_samples: 6144
  encre_system_prompt: "You are a careful, expert assistant.  Show your reasoning step by step."

# GRPO integration
grpo:
  use_encre_rollout: true
  encre_use_roundtable: false
  encre_system_prompt: "You are an agent.  Use the available tools to solve the task.  Stop when done."
  group_size: 6
  temperature: 1.0
  clip_ratio: 0.2
  entropy_coef: 0.01
  kl_coef: 0.1
  max_new_tokens: 1280
  ppo_epochs: 2
  agent_rollout_steps: 8
  max_tool_calls: 24
  tool_call_reward: 0.1
  task_completion_reward: 1.0
  efficiency_penalty: -0.01
