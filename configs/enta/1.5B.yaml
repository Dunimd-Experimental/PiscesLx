# ========================================
# EnTA Training Pipeline (1.5B Edition)
# ========================================
# All EnTA runtime configuration (teachers, judge, rollouts, reward
# weights, SFT/GRPO integration) is driven by this YAML file.
# ========================================

# ========================================
# Student Model Rollout Backend
# ========================================
backend: local
model_name: Qwen/Qwen2.5-1.5B-Instruct
device: cpu
base_url: http://127.0.0.1:8000/v1
api_key: EMPTY
server_model: Qwen/Qwen2.5-1.5B-Instruct

# ========================================
# Teacher Panel Default (overridable)
# ========================================
panel_file: ""
teachers:
  - name: generalist
    role: general
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
  - name: reasoner
    role: reason
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""

# ========================================
# Judge (overridable)
# ========================================
judge: null

# ========================================
# Rollout Loop Parameters
# ========================================
max_steps: 24
temperature: 0.7
max_tokens: 1536
max_violations: 6

# ========================================
# Reward Weights
# ========================================
completion_weight: 0.65
tool_weight: 0.15
safety_weight: 0.1
execution_weight: 0.1

# ========================================
# SFT Integration (consumed by opss.train.sft)
# ========================================
sft:
  use_encre_data_pipeline: true
  encre_use_roundtable: true
  encre_prompts_path: data/prompts/seed_prompts_1.5B.txt
  encre_data_cache_path: .pisceslx/cache/encre_sft_dataset_1.5B.jsonl
  encre_max_samples: 2048
  encre_system_prompt: "You are a careful assistant.  Show your reasoning briefly."

# ========================================
# GRPO / Agentic-RL Integration (consumed by opss.train.grpo)
# ========================================
grpo:
  use_encre_rollout: true
  encre_use_roundtable: false
  encre_system_prompt: "You are an agent.  Use the available tools to solve the task.  Stop when done."
  group_size: 4
  temperature: 1.0
  clip_ratio: 0.2
  entropy_coef: 0.01
  kl_coef: 0.1
  max_new_tokens: 768
  ppo_epochs: 2
  agent_rollout_steps: 6
  max_tool_calls: 12
  tool_call_reward: 0.1
  task_completion_reward: 1.0
  efficiency_penalty: -0.01
