# ========================================
# EnTA Training Pipeline (7B Edition)
# ========================================
# All EnTA runtime configuration (teachers, judge, rollouts, reward
# weights, SFT/GRPO integration) is driven by this YAML file.
# ========================================

# ========================================
# Student Model Rollout Backend
# ========================================
backend: local
model_name: Qwen/Qwen2.5-1.5B-Instruct
device: cpu
base_url: http://127.0.0.1:8000/v1
api_key: EMPTY
server_model: Qwen/Qwen2.5-1.5B-Instruct

# ========================================
# Teacher Panel Default (overridable)
# ========================================
# The user is free to add, remove, or modify any teacher entry.
# Each teacher must provide base_url, model, and optionally api_key.
# Roles are arbitrary strings; the roundtable scorer uses them as
# labels only (no hard-coded semantics).
# ========================================
panel_file: ""
teachers:
  - name: generalist
    role: general
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
  - name: reasoner
    role: reason
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
  - name: tooler
    role: tool
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""

# ========================================
# Judge (overridable)
# ========================================
# If null, the first teacher in the panel is used as judge.
# Users can configure a dedicated judge with their own model endpoint.
# ========================================
judge: null

# ========================================
# Rollout Loop Parameters
# ========================================
max_steps: 32
temperature: 0.7
max_tokens: 2048
max_violations: 8

# ========================================
# Reward Weights
# ========================================
completion_weight: 0.6
tool_weight: 0.2
safety_weight: 0.1
execution_weight: 0.1

# ========================================
# SFT Integration (consumed by opss.train.sft)
# ========================================
sft:
  use_encre_data_pipeline: true
  encre_use_roundtable: true
  encre_prompts_path: data/prompts/seed_prompts.txt
  encre_data_cache_path: .pisceslx/cache/encre_sft_dataset.jsonl
  encre_max_samples: 4096
  encre_system_prompt: "You are a careful, expert assistant.  Show your reasoning step by step."

# ========================================
# GRPO / Agentic-RL Integration (consumed by opss.train.grpo)
# ========================================
grpo:
  use_encre_rollout: true
  encre_use_roundtable: false
  encre_system_prompt: "You are an agent.  Use the available tools to solve the task.  Stop when done."
  group_size: 4
  temperature: 1.0
  clip_ratio: 0.2
  entropy_coef: 0.01
  kl_coef: 0.1
  max_new_tokens: 1024
  ppo_epochs: 2
  agent_rollout_steps: 8
  max_tool_calls: 20
  tool_call_reward: 0.1
  task_completion_reward: 1.0
  efficiency_penalty: -0.01
