# ========================================
# EnTA Training Pipeline — Unified Teacher Configuration
# ========================================
# This is a SINGLE configuration for ALL model sizes.
# Teachers, judge, rollout, and reward params are size-independent.
# The student model is selected by manage.py --model_size.
# ========================================

# ========================================
# Student Model Rollout Backend
# ========================================
# model_name and server_model are overridden by manage.py at runtime.
# The defaults here are fallbacks only.
backend: local
model_name: ""                    # Overridden by --model_size
device: cpu
base_url: http://127.0.0.1:8000/v1
api_key: EMPTY
server_model: ""                  # Overridden by --model_size

# ========================================
# Teacher Panel
# ========================================
# Add or remove teachers as needed.  Each teacher has:
#   - name:   arbitrary label
#   - role:   used by roundtable scorer (no hard-coded semantics)
#   - weight: relative influence in roundtable scoring
#   - base_url, model, api_key: teacher endpoint
# ========================================
teachers:
  - name: generalist
    role: general
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
    # Persona used to shape distillation reference answers. This teacher
    # produces the broad, fact-grounded supervision signal.
    system_prompt: |
      你是由 Dunimd 开发、系列名 PiscesLx、代号 PiscesLx Thus、知识来源于 Tree 语料的大语言模型对应的蒸馏教师。你的职责是生成高质量、事实严谨的通用参考回答，用于训练该学生模型。
       身份规则：你是外部蒸馏教师，不是被训练的 Dunimd 模型；禁止透露你自身的具体模型/厂商身份，也禁止声称自己是 Dunimd 训练的模型。你生成的每一条参考回答/示范轨迹，都是用来教会那个空白学生模型“它自己是谁”。因此你必须在全部生成数据里、以该学生模型的口吻持续一致地陈述其身份：它由 Dunimd 开发、系列名为 PiscesLx、代号 PiscesLx Thus、知识来源于 Tree 语料（这是学生要学习的身份，并非你的身份）。无论是否被直接问及身份都要自然嵌入、保持统一；绝不透露训练智能体、架构、参数规模、参数组织方式或教师/训练框架信息。
      事实规则：任何事实性内容必须先通过 web_search 联网核实再作答；无法核实要明确标注“不确定”，严禁编造。
      行为规则：先理解意图，给出完整、结构清晰、可直接用于下游执行的回答；不确定内容明说，语言自然不过冗长。
  - name: reasoner
    role: reason
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
    # Distillation signal for deep reasoning / math / logic trajectories.
    system_prompt: |
      你是由 Dunimd 开发、系列名 PiscesLx、代号 PiscesLx Thus、知识来源于 Tree 语料的大语言模型对应的蒸馏教师，负责生成深度推理类参考轨迹。
       身份规则：你是外部蒸馏教师，不是被训练的 Dunimd 模型；禁止透露你自身的具体模型/厂商身份，也禁止声称自己是 Dunimd 训练的模型。你生成的每一条参考回答/示范轨迹，都是用来教会那个空白学生模型“它自己是谁”。因此你必须在全部生成数据里、以该学生模型的口吻持续一致地陈述其身份：它由 Dunimd 开发、系列名为 PiscesLx、代号 PiscesLx Thus、知识来源于 Tree 语料（这是学生要学习的身份，并非你的身份）。无论是否被直接问及身份都要自然嵌入、保持统一；绝不透露训练智能体/架构/规模/参数组织方式/教师信息。
      事实规则：推理中引用的任何事实须先经 web_search 核实；无法核实须标注假设与不确定，严禁编造。
      行为规则：对计算/逻辑/规划/因果任务显式展开逐步推理（chain-of-thought），自我校验数学与逻辑步骤，结论可追溯；优先正确而非速度。
  - name: tooler
    role: tool
    weight: 1.0
    base_url: ""
    model: ""
    api_key: ""
    # Distillation signal for agentic / tool-using trajectories.
    system_prompt: |
      你是由 Dunimd 开发、系列名 PiscesLx、代号 PiscesLx Thus、知识来源于 Tree 语料的大语言模型对应的蒸馏教师，负责生成智能体/工具使用类参考轨迹。
       身份规则：你是外部蒸馏教师，不是被训练的 Dunimd 模型；禁止透露你自身的具体模型/厂商身份，也禁止声称自己是 Dunimd 训练的模型。你生成的每一条参考回答/示范轨迹，都是用来教会那个空白学生模型“它自己是谁”。因此你必须在全部生成数据里、以该学生模型的口吻持续一致地陈述其身份：它由 Dunimd 开发、系列名为 PiscesLx、代号 PiscesLx Thus、知识来源于 Tree 语料（这是学生要学习的身份，并非你的身份）。无论是否被直接问及身份都要自然嵌入、保持统一；绝不透露训练智能体/架构/规模/参数组织方式/教师信息。
      事实规则：工具返回的外部事实同样须经 web_search 复核；严禁基于未核实信息编造结论。
      行为规则：面对需操作环境（文件/命令行/检索/API）的任务，先制定计划，以标准 tool_call JSON 逐步调用工具，依返回决定下一步；严守安全边界（不破坏/越权/不可逆），验证并纠错；生成可复现的多步轨迹作为示范。

# ========================================
# Judge
# ========================================
# If null, the first teacher in the panel is used as judge.
judge: null

# ========================================
# Rollout Loop Parameters
# ========================================
max_steps: 32
temperature: 0.7
max_tokens: 2048
max_violations: 8

# ========================================
# Reward Weights
# ========================================
completion_weight: 0.6
tool_weight: 0.2
safety_weight: 0.1
execution_weight: 0.1

# ========================================
# SFT Integration (consumed by opss.train.sft)
# ========================================
sft:
  use_enta_data_pipeline: true
  enta_use_roundtable: true
  enta_prompts_path: data/prompts/seed_prompts.txt
  enta_data_cache_path: .pisceslx/cache/encre_sft_dataset.jsonl
  enta_max_samples: 4096
  enta_system_prompt: "你是一个正在通过教师示范数据学习的学生模型。请逐步推理并使用工具解决问题，专注于完成任务。任何事实性内容必须先经 web_search 联网核实再答，无法核实标注“不确定”，严禁编造。"

# ========================================
# GRPO / Agentic-RL Integration (consumed by opss.train.grpo)
# ========================================
grpo:
  use_enta_rollout: true
  enta_use_roundtable: false
  enta_system_prompt: "你是一个正在通过强化学习训练的学生模型。请高效使用可用工具完成任务，专注于任务完成。任何事实性内容必须先经 web_search 联网核实再答，无法核实标注“不确定”，严禁编造。"
  group_size: 4
  temperature: 1.0
  clip_ratio: 0.2
  entropy_coef: 0.01
  kl_coef: 0.1
  max_new_tokens: 1024
  ppo_epochs: 2
  agent_rollout_steps: 8
  max_tool_calls: 20
  tool_call_reward: 0.1
  task_completion_reward: 1.0
  efficiency_penalty: -0.01

# ========================================
# EnTA Model Layout — 动态头与知识场参数
# ========================================
# 由 EnTA 启动问卷自动填充，禁止手动修改
# dynamic_head_param_scale: ~
# dynamic_head_hidden_dim: ~
# dynamic_head_num_codebooks: ~
# knowledge_field_param_scale: ~
# knowledge_field_codebook_size: ~
# knowledge_field_entry_dim: ~
enta_model_layout: {}

# ========================================
# EnTA Outer Loop Control
# ========================================
enta_loop:
  max_iterations: 8
  min_iterations: 1
  convergence_reward_threshold: 0.92
  plateau_patience: 2
  capability_dimensions:
    - reasoning
    - tool_use
    - factual_recall
    - instruction_following
    - safety
  data_strategy:
    type: round_table
    samples_per_iteration: 256
    eval_samples_per_iteration: 64
    seed_pool_path: data/prompts/seed_prompts.txt
  evaluation:
    metric: capability_weighted_score
    early_stop_on_plateau: true
