  # ==========================================================================
  # Text Pre-training Corpora
  # ==========================================================================
  # Large-scale text collections for foundational language model pre-training.
  # These datasets provide broad coverage of general language patterns.
  # ==========================================================================

  # --------------------------------------------------------------------------
  # The Pile Deduplicated
  # --------------------------------------------------------------------------
  # DESCRIPTION:
  #     The Pile is a massive 825GB deduplicated text corpus curated by
  #     EleutherAI. It aggregates high-quality text from diverse sources
  #     including academic papers, books, web content, code, and more.
  #     The deduplicated version removes exact duplicates to improve
  #     training efficiency and reduce redundancy.
  #
  # CONTENT SOURCES:
  #     - Academic papers (arXiv, PubMed)
  #     - Books (Gutenberg, Books3)
  #     - Web content (OpenWebText2, Pile Subset)
  #     - Code (GitHub, Stack Exchange)
  #     - Conversations (ChatGPT interactions)
  #
  # USE CASE:
  #     Primary pre-training corpus for general language understanding
  # --------------------------------------------------------------------------
  - name: "EleutherAI/the_pile_deduplicated"
    save: "Pile"
    desc: "The Pile deduplicated - 825GB high-quality text"
    source: "huggingface"

  # --------------------------------------------------------------------------
  # English Wikipedia
  # --------------------------------------------------------------------------
  # DESCRIPTION:
  #     Complete English Wikipedia articles providing structured,
  #     encyclopedic knowledge coverage. Wikipedia is known for its
  #     high-quality, fact-checked content spanning all knowledge domains.
  #
  # CONTENT:
  #     - Encyclopedia articles
  #     - Historical events
  #     - Scientific concepts
  #     - Biographies
  #     - Geographic information
  #
  # USE CASE:
  #     Factual knowledge injection and structured reasoning
  # --------------------------------------------------------------------------
  - name: "wikipedia/en"
    save: "WikiEN"
    desc: "English Wikipedia"
    source: "huggingface"

  # --------------------------------------------------------------------------
  # BookCorpus
  # --------------------------------------------------------------------------
  # DESCRIPTION:
  #     Collection of books text extracted from various sources.
  #     Provides long-form narrative content with complex sentence
  #     structures and literary language patterns.
  #
  # CONTENT:
  #     - Fiction novels
  #     - Non-fiction books
  #     - Academic texts
  #     - Technical manuals
  #
  # USE CASE:
  #     Long-range dependency learning and narrative understanding
  # --------------------------------------------------------------------------
  - name: "bookcorpus/bookcorpus"
    save: "BookCorpus"
    desc: "BookCorpus - books text (if available in parquet format)"
    source: "huggingface"

