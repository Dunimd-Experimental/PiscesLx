# =============================================================================
# PiscesL1 Dataset Configuration Registry
# =============================================================================
#
# PURPOSE:
#     This file defines the complete registry of datasets used for training
#     the PiscesL1 large language model. It provides a centralized configuration
#     for all data sources across different modalities and domains.
#
# DATASET REGISTRY STRUCTURE:
#     Each dataset entry contains:
#     - name: Full dataset identifier (source format)
#     - save: Local storage name for cached data
#     - desc: Human-readable description of dataset content
#     - source: Data source platform (huggingface, modelscope, etc.)
#
# DATA SOURCES:
#     - huggingface: HuggingFace Hub (https://huggingface.co/datasets)
#     - modelscope: ModelScope (https://modelscope.cn/datasets)
#
# USAGE:
#     datasets:
#       - name: "dataset_identifier"
#         save: "local_name"
#         desc: "Description"
#         source: "platform"
#
# PROCESSING FLOW:
#     1. Dataset name is resolved to actual dataset location
#     2. Data is downloaded from source if not cached
#     3. Dataset is saved under the specified 'save' name
#     4. Post-download cleanup removes temporary files
#     5. Dataset is preprocessed according to model requirements
#
# =============================================================================

# Framework version placeholder - replaced with actual version during loading
version: "{{VERSION}}"

# =============================================================================
# Global Dataset Configuration
# =============================================================================
defaults:
  # Maximum samples per dataset (-1 means unlimited)
  # Type: integer
  # Default: -1 (no limit)
  # Range: -1 (unlimited), or positive integer (max samples)
  #
  # DESCRIPTION:
  #     Controls the maximum number of samples to use from any single dataset.
  #     Setting this to -1 disables the limit and uses all available samples.
  #     This is useful for:
  #     - Debugging with smaller data subsets
  #     - Balancing dataset contributions
  #     - Managing memory during development
  #
  #     For production training, typically set to -1 to utilize full datasets.
  #
  max_samples_per_dataset: -1

  # Post-download cleanup flag
  # Type: boolean
  # Default: true
  #
  # DESCRIPTION:
  #     When true, removes temporary files after dataset download completes.
  #     This saves disk space but extends download time.
  #     When false, keeps downloaded files for faster re-initialization.
  #
  post_download_clean: true

  # Source preference ordering for dataset resolution
  # Type: list of strings
  # Default: ["modelscope", "huggingface"]
  #
  # DESCRIPTION:
  #     Specifies the priority order when resolving dataset sources.
  #     If a dataset exists on multiple platforms, the first match wins.
  #     Useful for:
  #     - Preferring faster regional servers
  #     - Using platform-specific optimizations
  #     - Handling platform availability issues
  #
  source_preference:
    - "modelscope"
    - "huggingface"

# =============================================================================
# Dataset Registry
# =============================================================================
# All available datasets organized by category and domain.
# Each dataset is a single YAML mapping with name, save, desc, and source fields.
# =============================================================================

