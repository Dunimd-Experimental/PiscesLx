# =============================================================================
# Dataset Loading and Processing Notes
# =============================================================================
#
# DATASET RESOLUTION PROCESS:
#     1. Name Resolution:
#        - Check source_preference order for first available source
#        - Validate dataset exists on selected platform
#        - Handle dataset aliases and redirects
#
#     2. Download Phase:
#        - Create local cache directory structure
#        - Download dataset files from source
#        - Verify download integrity with checksums
#        - Extract archives if necessary
#
#     3. Storage Phase:
#        - Rename/copy to 'save' directory name
#        - Apply post_download_clean if enabled
#        - Create dataset metadata file
#
#     4. Preprocessing Phase:
#        - Tokenization according to model vocab
#        - Sequence packing for efficiency
#        - Quality filtering and deduplication
#        - Format conversion to training format
#
# MEMORY MANAGEMENT:
#     - Datasets are loaded on-demand, not all at once
#     - Use max_samples_per_dataset to limit memory
#     - Streaming mode available for very large datasets
#
# ERROR HANDLING:
#     - Network failures: Retry with exponential backoff
#     - Source unavailable: Fall back to next source in preference
#     - Corruption detected: Re-download affected dataset
#     - Missing dataset: Clear error message with resolution steps
#
# =============================================================================