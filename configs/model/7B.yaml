version: "{{VERSION}}"
model_type: piscesl1_7b
vocab_size: 151646
hidden_size: 3584
n_layer: 28
n_head: 32
n_kv_head: 8

moe_num_experts: 8
moe_top_k: 2
moe_capacity_factor: 1.5
moe_load_balance_alpha: 0.05
moe_noise_std: 0.4
moe_use_stable_gate: true
moe_min_capacity: 4
moe_prediction_horizon: 10
moe_routing_temperature: 3.0
moe_temperature_min: 0.8
moe_temperature_max: 3.0
moe_random_to_gradient_steps: 2000

enable_dynamic_fusion: true
fusion_quality_threshold: 0.2
fusion_dropout: 0.02
enable_cognitive_density: true
enable_dynamic_capacity: true

# Knowledge Density Optimization Configuration
expert_init_method: 'hybrid'
diversity_weight: 0.01
mi_weight: 0.1
online_clustering: true
orthogonality_weight: 0.01
routing_entropy_weight: 0.001
activation_variance_weight: 0.01
expert_warmup_steps: 100
auto_detect_clusters: true
min_clusters: 4
max_clusters: 12

intermediate_size: 14336
max_position_embeddings: 1048576
rope_theta: 10000.0
rope_scaling: null
dropout: 0.0

image_res: -1
image_patch: 14
max_image_res: 1024
use_native_resolution: true
enable_patch_pack: true
mm_tokens: 64
audio_tokens: 128
task_classes: 256
eval_dims: 7
residual_dropout_p: 0.1
use_gradient_checkpointing: true
use_pre_norm: true
attention_dropout: 0.0

training_config:
  learning_rate: 1.5e-5
  weight_decay: 0.01
  batch_size: 1
  sequence_length: 192
  gradient_accumulation_steps: 32
  max_steps: 100000
  warmup_ratio: 0.1
  warmup_steps: 100
  scheduler_name: cosine
  min_lr_ratio: 0.1
  scheduler:
    warmup_type: exponential
  gradient_checkpointing: true
  mixed_precision: bf16
  flash_attention: true
  loss_type: lm
  response_only_loss: false
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  packing: true
  max_grad_norm: 1.0
  quantization:
    enabled: true
    method: nf4
    bits: 4
    group_size: 128
    symmetric: false
  lora:
    enabled: true
    r: 16
    lora_alpha: 32
    target_modules:
      - q_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    lora_dropout: 0.05
    bias: none
  moe_gradient:
    enabled: true
  kfac:
    enabled: true
  multitask:
    enabled: false

inference_config:
  force_quant: null
  force_lora: true
  lora_config:
    r: 16
    lora_alpha: 32
    target_modules:
      - q_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    lora_dropout: 0.05
    bias: none
  sampling:
    temperature: 0.7
    top_p: 0.95
    max_length: 512
    top_k_short: 40
    top_p_short: 0.9
    top_k_long: 20
    top_p_long: 0.8
  vllm:
    use_vllm: false
    dtype: auto
    gpu_memory_utilization: 0.9
    tensor_parallel_size: 1
  speculative:
    enable: false
    gamma: 4
    draft_model: null
  chunk_size: 512

use_h2o_attention: true
streaming_window: 8192
compression_ratio: 8
max_cache_size: 8192
cache_quantization: true
kv_cache_block_size: 256
sdpa_prefer_flash: true

enable_speculative_decoding: true
speculative_candidates: 4
speculative_draft_length: 5
speculative_acceptance_threshold: 0.8
speculative_temperature: 0.7
speculative_top_k: 50
speculative_top_p: 0.9

galore_enabled: true
galore_rank: 160
galore_update_interval: 200
galore_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
galore_lr_ratio: 1.0
galore_min_rank: 40
galore_max_rank: 320
galore_rank_adapt_interval: 1000
galore_rank_adapt_threshold: 0.1
galore_quantization_bits: 8
galore_memory_efficient: true
galore_moe_expert_only: false
galore_multimodal_modules:
  - vision_encoder
  - audio_encoder
  - multimodal_fusion
galore_sequence_threshold: 4096
galore_gradient_accumulation_sync: true

# FP4 Training Configuration (75% memory savings vs BF16)
# Enable for extreme memory efficiency
use_fp4: true
fp4_block_size: 16
fp4_stochastic_rounding: true
fp4_master_weights_dtype: "fp32"

# Ink Optimizer Configuration
# Unified optimizer with INT8/INT4 compression, sparse gradients, GaLore, ROOT, QAT
ink_optimizer:
  enabled: true
  momentum_bits: 8
  momentum_block_size: 128
  variance_bits: 8
  variance_block_size: 256
  sparse_ratio: 0.01
  sparse_warmup_steps: 1000
  sparse_adaptive: true
  ortho_momentum: 0.9
  gradient_bits: 8
  gradient_block_size: 128
  gradient_sparse_ratio: 0.01
  kv_cache_bits: 8
  kv_cache_block_size: 64
  max_experts_on_gpu: 4
  moe_offload_threshold: 0.8
  moe_lru_cache_size: 8
  checkpoint_transformer: true
  checkpoint_ratio: 0.5
  checkpoint_preserve_ratio: 0.3
  root_ortho_steps: 5
  root_soft_threshold: 0.1
  root_spectral_norm_clip: 1.0
  root_min_dim_for_ortho: 16

chinchilla_optimal: false
chinchilla_c_budget: 0
chinchilla_d_ratio: 1.0

use_mla: true
kv_lora_rank: 512
mla_q_lora_rank: null
mla_rope_scaling_factor: 1.0

num_mtp_heads: 4
mtp_loss_weight: 0.5
mtp_share_embeddings: true

image_gen_resolution: 256
image_gen_num_steps: 50
image_gen_guidance_scale: 7.5
image_gen_initial_size: 8
image_gen_use_attention: true
image_gen_use_residual: true
image_gen_use_diffusion: true

audio_gen_sample_rate: 16000
audio_gen_n_mels: 128
audio_gen_duration: 5.0
audio_gen_num_steps: 100
audio_gen_streaming: true
audio_gen_num_codebooks: 2
audio_gen_codebook_size: 4096

video_gen_fps: 30
video_gen_num_frames: 16
video_gen_resolution: 256

generation_max_tokens: 1024
generation_temperature: 1.0
generation_top_p: 0.95
generation_top_k: 50

flagship_level: 0.7

dsa_sparse_ratio: 0.35
dsa_importance_threshold: 0.1
dsa_use_dynamic: true

thinking_intensity: 0.6
complexity_threshold_low: 0.3
complexity_threshold_high: 0.7

swarm_intensity: 0.6
num_swarm_agents: 4

coat_enabled: true
coat_amax_epsilon: 0.001
coat_scale_factor: 1.0
mixed_grain_activation: true
per_tensor_threshold: 1024
per_group_size: 128

use_int4_projection: true
use_int8_weights: true
adaptive_rank_update: true
convergence_threshold: 0.01

structured_sparsity: true
grass_block_size: 32
gradient_compression_ratio: 0.1

adaptive_recomputation: true
compute_cost_threshold: 0.5
activation_size_threshold: 1048576

enable_teraio: false
