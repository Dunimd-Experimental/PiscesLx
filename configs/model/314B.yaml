version: "{{VERSION}}"
model_type: piscesl1_314b
vocab_size: 151646
hidden_size: 12288
n_layer: 160
n_head: 96
n_kv_head: 12

moe_num_experts: 16
moe_top_k: 4
moe_capacity_factor: 2.0
moe_load_balance_alpha: 0.03
moe_noise_std: 0.25
moe_use_stable_gate: true
moe_min_capacity: 4
moe_prediction_horizon: 16
moe_routing_temperature: 2.2
moe_temperature_min: 0.8
moe_temperature_max: 2.2
moe_random_to_gradient_steps: 1000

enable_dynamic_fusion: true
fusion_quality_threshold: 0.14
fusion_dropout: 0.02
enable_cognitive_density: true
enable_dynamic_capacity: true

# Knowledge Density Optimization Configuration
expert_init_method: 'hybrid'
diversity_weight: 0.02
mi_weight: 0.2
online_clustering: true
orthogonality_weight: 0.02
routing_entropy_weight: 0.002
activation_variance_weight: 0.02
expert_warmup_steps: 200
auto_detect_clusters: true
min_clusters: 12
max_clusters: 28

intermediate_size: 49152
max_position_embeddings: 10485760
rope_theta: 10000.0
rope_scaling: null
dropout: 0.0

image_res: -1
image_patch: 14
max_image_res: 2048
use_native_resolution: true
enable_patch_pack: true
mm_tokens: 192
audio_tokens: 384
task_classes: 256
eval_dims: 7
residual_dropout_p: 0.1
use_gradient_checkpointing: true
use_pre_norm: true
attention_dropout: 0.0

# ========================================
# Algorithm Optimization Configuration
# ========================================
# QK Normalization: Stabilizes attention computation
use_qk_norm: true

# Label Smoothing: Prevents overfitting, improves generalization
label_smoothing: 0.1

# Learnable Attention Scale: Adaptive scaling for attention scores
learnable_attention_scale: true

# LayerScale Initialization: Stabilizes deep network training
# Formula: init_value = 1e-7 for ultra-deep networks (160+ layers)
layer_scale_init: 1.0e-7

# Depth-Aware Initialization: Adjusts init std based on network depth
# Formula: std = 1 / sqrt(2 * n_layer * hidden_size)
depth_aware_init: true

# Residual Alpha: Scales residual connections for stability
# Formula: alpha = (2 * n_layer) ** 0.25 for DeepNorm-style stability
residual_alpha: 3.56

# Embedding Normalization Weight: Auxiliary loss for stable training
embedding_norm_weight: 0.01

# Attention Residuals Configuration (Kimi AttnRes, arXiv:2603.15031, 2026)
# Replaces fixed-weight residual accumulation with dynamic attention-based aggregation
use_attn_res: true
attn_res_block_size: 8
attn_res_use_two_phase: true
attn_res_use_online_softmax: true
attn_res_cache_pipeline: true
attn_res_max_blocks: 32
attn_res_learnable_query: true
attn_res_use_rmsnorm: true

# Distributed Training (auto-enabled when multiple GPUs detected)
# Use --distributed flag or set enabled: true for multi-GPU training
distributed:
  enabled: true
  world_size: 0

training_config:
  learning_rate: 5.0e-6
  weight_decay: 0.01
  batch_size: 1
  sequence_length: 2048
  gradient_accumulation_steps: 64
  max_steps: 100000
  warmup_ratio: 0.1
  warmup_steps: 100
  scheduler_name: cosine
  min_lr_ratio: 0.1
  scheduler:
    warmup_type: exponential
  gradient_checkpointing: true
  mixed_precision: bf16
  flash_attention: true
  loss_type: lm
  response_only_loss: false
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  packing: true
  max_grad_norm: 1.0
  quantization:
    enabled: true
    method: nf4
    bits: 4
    group_size: 128
    symmetric: false
  lora:
    enabled: true
    r: 128
    lora_alpha: 256
    target_modules:
      - q_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    lora_dropout: 0.05
    bias: none
  moe_gradient:
    enabled: true
  kfac:
    enabled: true
  multitask:
    enabled: false

inference_config:
  force_quant: null
  force_lora: true
  lora_config:
    r: 128
    lora_alpha: 256
    target_modules:
      - q_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    lora_dropout: 0.05
    bias: none
  sampling:
    temperature: 0.7
    top_p: 0.95
    max_length: 512
    top_k_short: 40
    top_p_short: 0.9
    top_k_long: 20
    top_p_long: 0.8
  vllm:
    use_vllm: false
    dtype: auto
    gpu_memory_utilization: 0.9
    tensor_parallel_size: 1
  speculative:
    enable: false
    gamma: 4
    draft_model: null
  chunk_size: 512

use_h2o_attention: true
streaming_window: 32768
compression_ratio: 8
max_cache_size: 65536
cache_quantization: true
kv_cache_block_size: 1024
sdpa_prefer_flash: true

enable_speculative_decoding: true
speculative_candidates: 4
speculative_draft_length: 5
speculative_acceptance_threshold: 0.8
speculative_temperature: 0.7
speculative_top_k: 50
speculative_top_p: 0.9

galore_enabled: true
galore_rank: 768
galore_update_interval: 200
galore_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - moe_gate
galore_lr_ratio: 1.0
galore_min_rank: 192
galore_max_rank: 1536
galore_rank_adapt_interval: 1000
galore_rank_adapt_threshold: 0.1
galore_quantization_bits: 8
galore_memory_efficient: true
galore_moe_expert_only: false
galore_multimodal_modules:
  - vision_encoder
  - audio_encoder
  - multimodal_fusion
galore_sequence_threshold: 16384
galore_gradient_accumulation_sync: true

# FP4 Training Configuration (75% memory savings vs BF16)
# Enable for extreme memory efficiency
use_fp4: true
fp4_block_size: 16
fp4_stochastic_rounding: true
fp4_master_weights_dtype: "fp32"

ink_optimizer:
  enabled: true
  momentum_bits: 8
  variance_bits: 8
  sparse_ratio: 0.01
  gradient_bits: 8
  kv_cache_bits: 8
  galore_rank: 512
  max_experts_on_gpu: 8
  checkpoint_ratio: 0.5

chinchilla_optimal: false
chinchilla_c_budget: 0
chinchilla_d_ratio: 1.0

use_mla: true
kv_lora_rank: 2048
mla_q_lora_rank: null
mla_rope_scaling_factor: 1.0

# ========================================
# Flagship Algorithm Integration (2025-2026)
# ========================================

# EG-MLA: Embedding-Gated Multi-Head Latent Attention (NeurIPS 2025)
use_eg_mla: false
eg_mla_compression_ratio: 0.916

# DuoAttention: Retrieval vs Streaming Heads (ICLR 2026 MIT)
use_duo_attention: false
duo_attention_retrieval_ratio: 0.2
duo_attention_buffer_size: 1024

# Test-Time Training TTT-E2E (arXiv 2512.23675)
use_ttt_e2e: false
ttt_update_layers: 2
ttt_learning_rate: 0.00001
ttt_max_steps: 5
ttt_confidence_threshold: 0.6
ttt_complexity_threshold: 0.7

# Expert Evolution: Hebbian Learning + Domain Specialization
use_expert_evolution: false
expert_evolution_base_lr: 0.00001
expert_evolution_decay: 0.99

# EWC: Elastic Weight Consolidation
use_ewc: false
ewc_lambda: 1000.0

# SEAL: Self-Adapting LLMs (MIT 2025)
use_seal: false
seal_confidence_threshold: 0.85
seal_max_synthetic_samples: 100

# DAPO: Decoupled Clipping Policy Optimization (2025)
use_dapo: false
dapo_epsilon_low: 0.2
dapo_epsilon_high: 0.4
dapo_diversity_threshold: 0.3

# Verification: CRV + OTV + ARES
use_crv_verification: false
use_otv_verification: false
use_ares_verification: false
otv_quality_threshold: 0.6

# SyncFusion: Audio-Video Synchronous Understanding (ICLR 2025)
use_sync_fusion: false
sync_fusion_temporal_bins: 16

# Coupled Mamba Fusion (NeurIPS 2024)
use_coupled_mamba_fusion: false
coupled_mamba_coupling_strength: 0.3

# SparseSSM: Training-Free Mamba Pruning (ICLR 2026)
use_sparse_ssm: false
sparse_ssm_ratio: 0.5

# Gated Delta Networks (ICLR 2025)
use_gated_delta: false

# OOMB: Million-Token Context Training (ICLR 2026)
use_oomb_context: false
oomb_chunk_size: 32768
oomb_max_context: 4194304

# REFORM: Compress-Gather-Recompute (2025)
use_reform: false
reform_compression_ratio: 4
reform_importance_threshold: 0.1

# Quartet: End-to-End FP4 Training (OpenReview 2025)
use_quartet: false

# Long Context Extensions
max_context_length: 1048576

num_mtp_heads: 4
mtp_loss_weight: 0.5
mtp_share_embeddings: true

image_gen_resolution: 768
image_gen_num_steps: 50
image_gen_guidance_scale: 7.5
image_gen_initial_size: 8
image_gen_use_attention: true
image_gen_use_residual: true
image_gen_use_diffusion: true

audio_gen_sample_rate: 44100
audio_gen_n_mels: 128
audio_gen_duration: 20.0
audio_gen_num_steps: 100
audio_gen_streaming: true
audio_gen_num_codebooks: 4
audio_gen_codebook_size: 8192

video_gen_fps: 60
video_gen_num_frames: 90
video_gen_resolution: 768

generation_max_tokens: 4096
generation_temperature: 1.0
generation_top_p: 0.95
generation_top_k: 50

flagship_level: 0.95

dsa_sparse_ratio: 0.45
dsa_importance_threshold: 0.1
dsa_use_dynamic: true

use_hisa_attention: true
hisa_block_size: 64
hisa_superblock_size: 512
hisa_local_ratio: 0.4
hisa_block_ratio: 0.3

thinking_intensity: 0.8
complexity_threshold_low: 0.3
complexity_threshold_high: 0.7

swarm_intensity: 0.8
num_swarm_agents: 4

coat_enabled: true
coat_amax_epsilon: 0.001
coat_scale_factor: 1.0
mixed_grain_activation: true
per_tensor_threshold: 1024
per_group_size: 128

use_int4_projection: true
use_int8_weights: true
adaptive_rank_update: true
convergence_threshold: 0.01

structured_sparsity: true
grass_block_size: 32
gradient_compression_ratio: 0.1

adaptive_recomputation: true
compute_cost_threshold: 0.5
activation_size_threshold: 1048576

enable_teraio: false
gpu_memory_budget: 42949672960
cpu_memory_budget: 137438953472
enable_gds: true

modal_aware_routing: true
n_cross_modal_experts: 0
modal_affinity_alpha: 1.0
n_modalities: 7

use_recurrent_modal_refiner: true
rdt_max_loops: 3
rdt_spectral_radius: 0.95
rdt_convergence_threshold: 0.99
rdt_refine_heads: 2
rdt_refine_ffn_ratio: 1.0

modal_protection_mod: true

use_ultra_sparse_gate: false
ultra_sparse_tier1_threshold: 0.3
ultra_sparse_tier2_threshold: 0.8
ultra_sparse_tier1_topk: 1
ultra_sparse_tier2_topk: 2
ultra_sparse_tier3_topk: 4

use_circulant_attention: true
circulant_threshold: 4096

use_rdt_layers: true
rdt_layer_indices: []
rdt_loops_per_layer: 2

# ========================================
# Memory Separation (Engram-style Lookup-Computation Separation)
# 314B: hidden=12288, n_layer=160 -> ~3.93B knowledge slots
# Real reasoning weights ~314B, knowledge store ~3.93B slots (mmap, ~980GB)
# ========================================
use_memory_separation: true
memory_read_interval: 4
memory_top_k: 32
memory_cache_tokens: 8192
memory_prefetch_depth: 6
memory_capacity_factor: 2.0
memory_store_path: ""

# ========================================
# Subconscious System (0.5B Head + 314B Implicit Knowledge Field)
# Scaled for 314B: hidden=12288, n_layer=160.
# ========================================
use_subconscious: true
subconscious_knowledge_dim: 256
subconscious_num_codebooks: 16
subconscious_codebook_size: 131072
subconscious_codebook_dim: 128
subconscious_num_field_heads: 8
subconscious_head_dim: 2560
subconscious_head_num_layers: 2
subconscious_head_num_attn_heads: 4
subconscious_read_interval: 1
subconscious_prefetch_depth: 2


# ========================================
# EnTA Training Pipeline (Multi-Teacher Roundtable)
# All EnTA-specific configuration (teachers, judge, reward weights,
# rollout parameters, SFT/GRPO integration) lives in a separate file
# so this model YAML stays focused on the architecture.
# ========================================
encre:
  config_path: configs/enta/314B.yaml
