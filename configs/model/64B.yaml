version: "{{VERSION}}"
model_type: piscesl1_64b
vocab_size: 151646
hidden_size: 6656
n_layer: 80
n_head: 52
n_kv_head: 8

moe_num_experts: 8
moe_top_k: 2
moe_capacity_factor: 1.7
moe_load_balance_alpha: 0.04
moe_noise_std: 0.3
moe_use_stable_gate: true
moe_min_capacity: 4
moe_prediction_horizon: 10
moe_routing_temperature: 2.5
moe_temperature_min: 0.8
moe_temperature_max: 2.8
moe_random_to_gradient_steps: 1500

enable_dynamic_fusion: true
fusion_quality_threshold: 0.17
fusion_dropout: 0.02
enable_cognitive_density: true
enable_dynamic_capacity: true

# Knowledge Density Optimization Configuration
expert_init_method: 'hybrid'
diversity_weight: 0.015
mi_weight: 0.15
online_clustering: true
orthogonality_weight: 0.015
routing_entropy_weight: 0.0015
activation_variance_weight: 0.015
expert_warmup_steps: 150
auto_detect_clusters: true
min_clusters: 8
max_clusters: 20

intermediate_size: 26624
max_position_embeddings: 262144
rope_theta: 10000.0
rope_scaling: null
dropout: 0.0

image_res: -1
image_patch: 14
max_image_res: 1024
use_native_resolution: true
enable_patch_pack: true
mm_tokens: 96
audio_tokens: 192
task_classes: 256
eval_dims: 7
residual_dropout_p: 0.1
use_gradient_checkpointing: true
use_pre_norm: true
attention_dropout: 0.0

# ========================================
# Algorithm Optimization Configuration
# ========================================
# QK Normalization: Stabilizes attention computation
use_qk_norm: true

# Label Smoothing: Prevents overfitting, improves generalization
label_smoothing: 0.1

# Learnable Attention Scale: Adaptive scaling for attention scores
learnable_attention_scale: true

# LayerScale Initialization: Stabilizes deep network training
# Formula: init_value = 1e-6 for very deep networks (80+ layers)
layer_scale_init: 1.0e-6

# Depth-Aware Initialization: Adjusts init std based on network depth
# Formula: std = 1 / sqrt(2 * n_layer * hidden_size)
depth_aware_init: true

# Residual Alpha: Scales residual connections for stability
# Formula: alpha = (2 * n_layer) ** 0.25 for DeepNorm-style stability
residual_alpha: 3.0

# Embedding Normalization Weight: Auxiliary loss for stable training
embedding_norm_weight: 0.01

# Attention Residuals Configuration (Kimi AttnRes, arXiv:2603.15031, 2026)
# Replaces fixed-weight residual accumulation with dynamic attention-based aggregation
use_attn_res: true
attn_res_block_size: 8
attn_res_use_two_phase: true
attn_res_use_online_softmax: true
attn_res_cache_pipeline: true
attn_res_max_blocks: 32
attn_res_learnable_query: true
attn_res_use_rmsnorm: true

# Manifold-Constrained Hyper-Connections (mHC, DeepSeek-V4 Pro, 2026)
# Replaces standard residual with expanded stream + Birkhoff polytope constraint
use_mhc: true
mhc_n_hc: 4
mhc_sinkhorn_iters: 20

# PathMoE: Cross-layer shared routing (2026)
# Shares router parameters across stages of MoE layers for improved efficiency
use_path_moe: true
path_moe_stage_size: 4

# Phi-Balancing: Population-level mirror descent load balancing (2026)
# EMA-based expert load balancing without auxiliary loss
use_phi_balancing: true
phi_balancing_momentum: 0.95
phi_balancing_lr: 0.01
phi_balancing_ema_decay: 0.99

# HydraHead: Head-level FA/LA hybrid attention (2026)
# Splits heads into softmax (FA) and linear (LA) attention groups
use_hydra_head: true
hydra_head_la_ratio: 0.5
hydra_head_learnable_assignment: true
hydra_head_temperature: 1.0

# LCA: Latent-Condensed Attention (2026)
# Condenses KV representations into lower-dimensional latent space
use_lca: true
lca_latent_dim: 512
lca_condense_factor: 0.25
lca_use_residual: true

# DSpark: Parallel speculative decoding with Markov head (2026)
# Parallel draft generation + confidence scheduling
use_dspark: true
dspark_markov_order: 5
dspark_parallel_candidates: 3
dspark_confidence_window: 10

# MoVE: Multi-Encoder Vision Ensemble (2026)
# Routes tokens through multiple vision backbones with learned gating
use_move_encoder: true
move_encoder_list: ["siglip"]
move_top_k: 1

# SparseCut: Token pruning for vision (2026)
# Post-encoder token reduction via learned importance scoring
use_sparse_cut: true
sparse_cut_ratio: 0.5

# Distributed Training (auto-enabled when multiple GPUs detected)
# Use --distributed flag or set enabled: true for multi-GPU training
distributed:
  enabled: true
  world_size: 0

training_config:
  learning_rate: 1.0e-5
  weight_decay: 0.01
  batch_size: 1
  sequence_length: 2048
  gradient_accumulation_steps: 16
  max_steps: 100000
  warmup_ratio: 0.1
  warmup_steps: 100
  scheduler_name: cosine
  min_lr_ratio: 0.1
  scheduler:
    warmup_type: exponential
  gradient_checkpointing: true
  mixed_precision: bf16
  flash_attention: true
  loss_type: lm
  response_only_loss: false
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  packing: true
  max_grad_norm: 1.0
  quantization:
    enabled: true
    method: nf4
    bits: 4
    group_size: 128
    symmetric: false
  lora:
    enabled: true
    r: 64
    lora_alpha: 128
    target_modules:
      - q_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    lora_dropout: 0.05
    bias: none
  moe_gradient:
    enabled: true
  kfac:
    enabled: true
  multitask:
    enabled: false
  # GRPO Upgrades (2026): VPS, MMR-GRPO, TR-GRPO
  use_vps: true
  vps_outcome_weight: 0.7
  vps_process_weight: 0.3
  vps_step_delimiter: "\n\n"
  vps_min_steps: 2
  vps_quality_scale: 1.0
  use_mmr_grpo: true
  mmr_buffer_size: 128
  mmr_diversity_weight: 0.3
  mmr_similarity_threshold: 0.8
  mmr_mix_ratio: 0.5
  mmr_embedding_dim: 256
  use_tr_grpo: true
  tr_importance_scale: 1.0
  tr_importance_bias: 0.0
  tr_token_clip_ratio: 0.2


inference_config:
  force_quant: null
  force_lora: true
  lora_config:
    r: 64
    lora_alpha: 128
    target_modules:
      - q_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    lora_dropout: 0.05
    bias: none
  sampling:
    temperature: 0.7
    top_p: 0.95
    max_length: 512
    top_k_short: 40
    top_p_short: 0.9
    top_k_long: 20
    top_p_long: 0.8
  vllm:
    use_vllm: false
    dtype: auto
    gpu_memory_utilization: 0.9
    tensor_parallel_size: 1
  speculative:
    enable: false
    gamma: 4
    draft_model: null
  chunk_size: 512

use_h2o_attention: true
streaming_window: 8192
compression_ratio: 8
max_cache_size: 16384
cache_quantization: true
kv_cache_block_size: 512
sdpa_prefer_flash: true

enable_speculative_decoding: true
speculative_candidates: 4
speculative_draft_length: 5
speculative_acceptance_threshold: 0.8
speculative_temperature: 0.7
speculative_top_k: 50
speculative_top_p: 0.9

galore_enabled: true
galore_rank: 256
galore_update_interval: 200
galore_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  - moe_gate
galore_lr_ratio: 1.0
galore_min_rank: 64
galore_max_rank: 512
galore_rank_adapt_interval: 1000
galore_rank_adapt_threshold: 0.1
galore_quantization_bits: 8
galore_memory_efficient: true
galore_moe_expert_only: false
galore_multimodal_modules:
  - vision_encoder
  - audio_encoder
  - multimodal_fusion
galore_sequence_threshold: 8192
galore_gradient_accumulation_sync: true

# FP4 Training Configuration (75% memory savings vs BF16)
# Enable for extreme memory efficiency
use_fp4: true
fp4_block_size: 16
fp4_stochastic_rounding: true
fp4_master_weights_dtype: "fp32"

ink_optimizer:
  enabled: true
  momentum_bits: 8
  variance_bits: 8
  sparse_ratio: 0.01
  gradient_bits: 8
  kv_cache_bits: 8
  galore_rank: 320
  max_experts_on_gpu: 6
  checkpoint_ratio: 0.5

chinchilla_optimal: false
chinchilla_c_budget: 0
chinchilla_d_ratio: 1.0

use_mla: true
kv_lora_rank: 896
mla_q_lora_rank: null
mla_rope_scaling_factor: 1.0

# ========================================
# Flagship Algorithm Integration (2025-2026)
# ========================================

# EG-MLA: Embedding-Gated Multi-Head Latent Attention (NeurIPS 2025)
use_eg_mla: false
eg_mla_compression_ratio: 0.916

# DuoAttention: Retrieval vs Streaming Heads (ICLR 2026 MIT)
use_duo_attention: false
duo_attention_retrieval_ratio: 0.2
duo_attention_buffer_size: 1024

# Test-Time Training TTT-E2E (arXiv 2512.23675)
use_ttt_e2e: false
ttt_update_layers: 2
ttt_learning_rate: 0.00001
ttt_max_steps: 5
ttt_confidence_threshold: 0.6
ttt_complexity_threshold: 0.7

# Expert Evolution: Hebbian Learning + Domain Specialization
use_expert_evolution: false
expert_evolution_base_lr: 0.00001
expert_evolution_decay: 0.99

# EWC: Elastic Weight Consolidation
use_ewc: false
ewc_lambda: 1000.0

# SEAL: Self-Adapting LLMs (MIT 2025)
use_seal: false
seal_confidence_threshold: 0.85
seal_max_synthetic_samples: 100

# DAPO: Decoupled Clipping Policy Optimization (2025)
use_dapo: false
dapo_epsilon_low: 0.2
dapo_epsilon_high: 0.4
dapo_diversity_threshold: 0.3

# Verification: CRV + OTV + ARES
use_crv_verification: false
use_otv_verification: false
use_ares_verification: false
otv_quality_threshold: 0.6

# SyncFusion: Audio-Video Synchronous Understanding (ICLR 2025)
use_sync_fusion: false
sync_fusion_temporal_bins: 16

# Coupled Mamba Fusion (NeurIPS 2024)
use_coupled_mamba_fusion: false
coupled_mamba_coupling_strength: 0.3

# SparseSSM: Training-Free Mamba Pruning (ICLR 2026)
use_sparse_ssm: false
