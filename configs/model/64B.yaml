# ========================================
# Memory Separation (Engram-style Lookup-Computation Separation)
# 64B: hidden=6656, n_layer=80 -> ~639M knowledge slots
# Real reasoning weights ~64B, knowledge store ~639M slots (mmap, ~160GB)
# ========================================
use_memory_separation: true
memory_read_interval: 4
memory_top_k: 16
memory_cache_tokens: 4096
memory_prefetch_depth: 4
memory_capacity_factor: 1.2
memory_store_path: ""

# ========================================
# Subconscious System (0.5B Head + 314B Implicit Knowledge Field)
# Scaled for 64B: hidden=6656, n_layer=80.
# ========================================
use_subconscious: true
