version: "{{VERSION}}"
model_type: piscesl1_0.5b
vocab_size: 151646
hidden_size: 640
n_layer: 16
n_head: 10
n_kv_head: 5

moe_num_experts: 4
moe_top_k: 2
moe_capacity_factor: 1.2
moe_load_balance_alpha: 0.05
moe_noise_std: 0.35
moe_use_stable_gate: true
moe_min_capacity: 4
moe_prediction_horizon: 8
moe_routing_temperature: 3.0
moe_temperature_min: 0.8
moe_temperature_max: 3.0
moe_random_to_gradient_steps: 2000

enable_dynamic_fusion: true
fusion_quality_threshold: 0.25
fusion_dropout: 0.03
enable_cognitive_density: true
enable_dynamic_capacity: true

# Knowledge Density Optimization Configuration
expert_init_method: 'hybrid'
diversity_weight: 0.005
mi_weight: 0.05
online_clustering: true
orthogonality_weight: 0.005
routing_entropy_weight: 0.0005
activation_variance_weight: 0.005
expert_warmup_steps: 50
auto_detect_clusters: true
min_clusters: 2
max_clusters: 8

intermediate_size: 1280
max_position_embeddings: 262144
rope_theta: 10000.0
rope_scaling: null
dropout: 0.0

image_res: -1
image_patch: 14
max_image_res: 512
use_native_resolution: false
enable_patch_pack: false
mm_tokens: 16
audio_tokens: 32
task_classes: 256
eval_dims: 7
residual_dropout_p: 0.1
use_gradient_checkpointing: true
use_pre_norm: true
attention_dropout: 0.0

# ========================================
# Algorithm Optimization Configuration
# ========================================
# QK Normalization: Stabilizes attention computation
use_qk_norm: true

# Label Smoothing: Prevents overfitting, improves generalization
label_smoothing: 0.1

# Learnable Attention Scale: Adaptive scaling for attention scores
learnable_attention_scale: true

# LayerScale Initialization: Stabilizes deep network training
# Formula: init_value = 1e-5 for deep networks
layer_scale_init: 1.0e-5

# Depth-Aware Initialization: Adjusts init std based on network depth
# Formula: std = 1 / sqrt(2 * n_layer * hidden_size)
depth_aware_init: true

# Residual Alpha: Scales residual connections for stability
# Formula: alpha = (2 * n_layer) ** 0.25 for DeepNorm-style stability
residual_alpha: 2.0

# Embedding Normalization Weight: Auxiliary loss for stable training
embedding_norm_weight: 0.01

# Attention Residuals Configuration (Kimi AttnRes, arXiv:2603.15031, 2026)
# Replaces fixed-weight residual accumulation with dynamic attention-based aggregation
use_attn_res: true
attn_res_block_size: 8
attn_res_use_two_phase: true
attn_res_use_online_softmax: true
attn_res_cache_pipeline: true
attn_res_max_blocks: 32
attn_res_learnable_query: true
attn_res_use_rmsnorm: true

training_config:
  learning_rate: 3.0e-5
  weight_decay: 0.01
  batch_size: 1
  sequence_length: 512
  gradient_accumulation_steps: 8
  max_steps: 100000
  warmup_ratio: 0.1
  warmup_steps: 100
  scheduler_name: cosine
  min_lr_ratio: 0.1
  scheduler:
    warmup_type: exponential
  gradient_checkpointing: true
  mixed_precision: bf16
  flash_attention: true
  loss_type: lm
  response_only_loss: false
  num_workers: 4
  pin_memory: true
  prefetch_factor: 4
  packing: true
  max_grad_norm: 1.0
  quantization:
    enabled: true
    method: nf4
    bits: 4
    group_size: 128
    symmetric: false
  lora:
    enabled: true
    r: 8
    lora_alpha: 32
    target_modules:
      - q_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    lora_dropout: 0.05
    bias: none
  moe_gradient:
    enabled: true
  kfac:
    enabled: false
  multitask:
    enabled: false

inference_config:
  force_quant: null
  force_lora: false
  lora_config:
    r: 8
    lora_alpha: 32
    target_modules:
      - q_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    lora_dropout: 0.05
    bias: none
  sampling:
    temperature: 0.7
    top_p: 0.95
    max_length: 512
    top_k_short: 40
    top_p_short: 0.9
    top_k_long: 20
    top_p_long: 0.8
  vllm:
    use_vllm: false
    dtype: auto
    gpu_memory_utilization: 0.9
    tensor_parallel_size: 1
  speculative:
    enable: false
    gamma: 4
    draft_model: null
  chunk_size: 512

use_h2o_attention: true
streaming_window: 4096
compression_ratio: 8
max_cache_size: 4096
cache_quantization: true
kv_cache_block_size: 256
sdpa_prefer_flash: true

enable_speculative_decoding: false
speculative_candidates: 4
speculative_draft_length: 4
speculative_acceptance_threshold: 0.8
speculative_temperature: 0.7
speculative_top_k: 50
speculative_top_p: 0.9

galore_enabled: true
galore_rank: 48
galore_update_interval: 200
galore_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
galore_lr_ratio: 1.0
galore_min_rank: 12
galore_max_rank: 96
galore_rank_adapt_interval: 1000
galore_rank_adapt_threshold: 0.1
galore_quantization_bits: 8
galore_memory_efficient: true
galore_moe_expert_only: false
galore_multimodal_modules:
  - vision_encoder
  - audio_encoder
  - multimodal_fusion
galore_sequence_threshold: 1024
galore_gradient_accumulation_sync: true

# FP4 Training Configuration (75% memory savings vs BF16)
# Enable for extreme memory efficiency: ~3GB for 0.5B model
use_fp4: true
fp4_block_size: 16
fp4_stochastic_rounding: true
fp4_master_weights_dtype: "fp32"

ink_optimizer:
  enabled: true
  momentum_bits: 8
  variance_bits: 8
  sparse_ratio: 0.01
  gradient_bits: 8
  kv_cache_bits: 8
  galore_rank: 80
  max_experts_on_gpu: 2
  checkpoint_ratio: 0.5

chinchilla_optimal: false
chinchilla_c_budget: 0
chinchilla_d_ratio: 1.0

use_mla: true
kv_lora_rank: 256
mla_q_lora_rank: null
mla_rope_scaling_factor: 1.0

num_mtp_heads: 4
mtp_loss_weight: 0.5
mtp_share_embeddings: true

image_gen_resolution: 128
image_gen_num_steps: 30
image_gen_guidance_scale: 5.0
image_gen_initial_size: 8
image_gen_use_attention: false
image_gen_use_residual: true
image_gen_use_diffusion: false

audio_gen_sample_rate: 16000
audio_gen_n_mels: 80
audio_gen_duration: 3.0
audio_gen_num_steps: 50
audio_gen_streaming: true
audio_gen_num_codebooks: 2
audio_gen_codebook_size: 2048

video_gen_fps: 16
video_gen_num_frames: 8
video_gen_resolution: 128

generation_max_tokens: 512
generation_temperature: 1.0
generation_top_p: 0.95
generation_top_k: 50

flagship_level: 0.5

dsa_sparse_ratio: 0.3
dsa_importance_threshold: 0.1
dsa_use_dynamic: true

use_hisa_attention: true
hisa_block_size: 64
hisa_superblock_size: 512
hisa_local_ratio: 0.4
hisa_block_ratio: 0.3

thinking_intensity: 0.5
complexity_threshold_low: 0.3
complexity_threshold_high: 0.7

swarm_intensity: 0.5
num_swarm_agents: 4

coat_enabled: true
coat_amax_epsilon: 0.001
coat_scale_factor: 1.0
mixed_grain_activation: true
per_tensor_threshold: 1024
per_group_size: 128

use_int4_projection: true
use_int8_weights: true
adaptive_rank_update: true
convergence_threshold: 0.01

structured_sparsity: true
grass_block_size: 32
gradient_compression_ratio: 0.1

adaptive_recomputation: true
compute_cost_threshold: 0.5
activation_size_threshold: 1048576

enable_teraio: false
gpu_memory_budget: 42949672960
cpu_memory_budget: 137438953472
enable_gds: true

modal_aware_routing: true
n_cross_modal_experts: 0
modal_affinity_alpha: 1.0
n_modalities: 7

use_recurrent_modal_refiner: true
rdt_max_loops: 3
rdt_spectral_radius: 0.95
rdt_convergence_threshold: 0.99
rdt_refine_heads: 2
rdt_refine_ffn_ratio: 1.0

modal_protection_mod: true

use_ultra_sparse_gate: false
ultra_sparse_tier1_threshold: 0.3
ultra_sparse_tier2_threshold: 0.8
ultra_sparse_tier1_topk: 1
ultra_sparse_tier2_topk: 2
ultra_sparse_tier3_topk: 4

use_circulant_attention: true
circulant_threshold: 4096

use_rdt_layers: true
rdt_layer_indices: []
rdt_loops_per_layer: 2
