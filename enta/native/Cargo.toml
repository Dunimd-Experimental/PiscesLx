# EnTA — Rust native core workspace
# Provides the high-performance Rust backends for the EnTA Python
# package: file I/O, regex search, glob, unified diff, sandbox,
# BM25 indexer, Landlock, LSP protocol, token counting, …

[workspace]
resolver = "2"
members = ["crates/enta-core", "crates/enta-py"]