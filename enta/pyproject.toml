[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "enta"
version = "0.1.5"
description = "EnTA — Python agent framework (the core AI Agent package of the EnTA project)"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "lxml>=5.1",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
    "cryptography>=41.0",
    "zero-api-key-web-search>=23.0",
    "pathspec>=0.12",
    "websockets>=12.0,<14",
    "Pillow>=10.0",
    "playwright>=1.40",
    "tiktoken>=0.5",
    "numpy>=1.24",
    "loguru>=0.7",
    "mss>=9.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.10",
    "pyautogui>=0.9",
    "pypdf>=4.0",
    "PyPDF2>=3.0",
    "pytesseract>=0.3",
    "uiautomation>=2.0",
    "watchfiles>=0.21",
    "tree-sitter>=0.21",
    "tree-sitter-language-pack>=0.6",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["enta*"]

# [tool.setuptools-rust]
# module = "backend.enta._native"
# (manual: _native.pyd is copied into backend/enta/ during setup)

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.1"]
native = ["enta-native==0.1.5"]
aiohttp = ["aiohttp>=3.9"]
discord = ["discord.py>=2.3"]
slack = ["slack_bolt>=1.18", "slack_sdk>=3.27"]
telegram = ["python-telegram-bot>=20.0"]
dingtalk = ["dingtalk-stream>=0.15"]
email = ["aioimaplib>=1.1", "aiosmtplib>=1.0"]
local = ["torch>=2.0", "transformers>=4.36"]
aws = ["boto3>=1.34"]
tracing = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-grpc>=1.25"]
all = [
    "enta[anthropic,ollama,native,aiohttp,discord,slack,telegram,dingtalk,email,local,aws,tracing]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
markers = ["asyncio: mark a test as an async test"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["crates", "_native.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["SIM", "ARG", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["crates/", "build/", "dist/"]
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
